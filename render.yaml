services:
  - type: web
    name: aurora-mobile
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./backend/src/PosMobile/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__AllowLocalHttp
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-mobile-db
          property: connectionString
      - key: Bootstrap__Username
        sync: false
      - key: Bootstrap__Password
        sync: false
      - key: Bootstrap__StoreName
        sync: false
databases:
  - name: aurora-mobile-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: aurora_mobile
    user: aurora_mobile
    diskSizeGB: 5
    ipAllowList: []
